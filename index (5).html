<style>

<div class="pn" id="I"><button id="ix" aria-label="Đóng" title="Đóng">✕</button><div id="ib"><h3>Chạm vào mô hình</h3><p>Nhấn vào lá, khí khổng, lục lạp, rễ, thân, mặt trời… để xem giải thích, camera sẽ tự bay tới bộ phận đó. Kéo để xoay, cuộn hoặc chụm hai ngón để thu phóng, kéo chuột phải (hai ngón) để di chuyển.</p></div></div>

<script>
const INFO={
sun:["Mặt trời – ánh sáng","Nguồn năng lượng của quang hợp. Diệp lục hấp thụ chủ yếu ánh sáng đỏ và xanh lam rồi chuyển thành năng lượng hóa học."],
leaf:["Lá cà phê","Phiến lá rộng, bóng, nhận nhiều ánh sáng. Thịt lá chứa nhiều lục lạp, mặt dưới có khí khổng để trao đổi khí. Gân lá dẫn nước, khoáng vào và đưa đường ra."],
stomata:["Khí khổng","Lỗ nhỏ ở biểu bì lá, do 2 tế bào hình hạt đậu đóng mở. Ban ngày khí khổng mở: CO₂ đi vào, O₂ và hơi nước thoát ra. Khi thiếu nước hoặc ban đêm, khí khổng khép lại."],
guard:["Tế bào bảo vệ","Khi no nước, tế bào phồng lên và cong ra làm khe mở. Khi mất nước, tế bào xẹp lại làm khe đóng, giúp cây hạn chế mất nước."],
mesophyll:["Thịt lá","Các tế bào chứa rất nhiều lục lạp, là nơi diễn ra quang hợp. Khoảng trống giữa các tế bào giúp CO₂ khuếch tán tới lục lạp."],

grana:["Hạt grana – Pha sáng","Màng thylakoid hấp thụ ánh sáng, quang phân li nước: 2H₂O → O₂ + H⁺ + e⁻. Năng lượng lưu vào ATP và NADPH. O₂ thải ra ngoài, ATP và NADPH chuyển sang stroma cho chu trình Calvin."],

fix:["Giai đoạn 1: Cố định CO₂","Enzyme RuBisCO gắn CO₂ vào RuDP (5C), tạo hợp chất 6C không bền rồi tách ngay thành 2 phân tử APG (3C). Đây là bước đưa carbon từ khí CO₂ vào chất hữu cơ."],
red:["Giai đoạn 2: Khử APG","ATP cung cấp năng lượng, NADPH cung cấp điện tử và hydro để khử APG thành AlPG (3C). Sau bước này ATP thành ADP và NADPH thành NADP⁺, quay về pha sáng để được nạp lại."],
reg:["Giai đoạn 3: Tái tạo RuDP","Phần lớn AlPG, cùng thêm ATP, được dùng để tái tạo RuDP (5C) nên chu trình tiếp tục. Một phần AlPG rời chu trình để tổng hợp glucose. Cần 6 vòng để tạo 1 phân tử glucose (6C)."],
rubp:["RuDP (5C)","Chất nhận CO₂. Enzyme RuBisCO gắn CO₂ vào RuDP tạo hợp chất 6C không bền, tách ngay thành 2 phân tử APG."],
pga:["APG (3C)","Sản phẩm đầu tiên của cố định CO₂. Được ATP và NADPH khử thành AlPG."],
g3p:["AlPG (3C)","Đường 3 carbon. Một phần rời chu trình để tổng hợp glucose, tinh bột, phần còn lại tái tạo RuDP."],
trunk:["Thân cây","Nâng đỡ tán lá, vận chuyển hai chiều: mạch gỗ đưa nước và khoáng đi lên, mạch rây đưa đường từ lá đi xuống."],

phloem:["Mạch rây – đi xuống","Vận chuyển đường (saccarozơ) tạo ra từ quang hợp từ lá đến rễ, thân, hoa, quả để dùng hoặc dự trữ."],
root:["Rễ","Giữ cây trong đất, hút nước và muối khoáng rồi đẩy lên mạch gỗ của thân. Hệ rễ gồm rễ cọc, rễ bên và nhiều nhánh nhỏ phân nhánh dày. Rễ cũng nhận đường từ lá để dự trữ và hô hấp."],
roothair:["Lông hút","Tế bào biểu bì rễ kéo dài thành lông mảnh, tăng mạnh diện tích tiếp xúc với đất. Hút nước bằng thẩm thấu, hút khoáng bằng vận chuyển chủ động, rồi chuyển vào mạch gỗ."],
soil:["Đất","Chứa nước và muối khoáng hòa tan (N, P, K…). Rễ lấy chúng qua lông hút."],
co2:["Khí CO₂","Nguyên liệu của quang hợp, vào lá qua khí khổng, đến lục lạp và được cố định trong chu trình Calvin."],
o2:["Khí O₂","Sản phẩm phụ của pha sáng, sinh ra khi nước bị quang phân. O₂ thoát ra qua khí khổng, một phần dùng cho hô hấp."],
glucose:["Glucose / đường","Sản phẩm của quang hợp. Cây dùng để hô hấp, tạo tinh bột, xenlulozơ và vận chuyển đi nuôi cây qua mạch rây."],

mineral:["Muối khoáng","Rễ hút cùng nước. Cần để tạo diệp lục (Mg, N), enzyme, ATP… giúp cây sinh trưởng."],

atp:["ATP và NADPH","Hợp chất mang năng lượng và điện tử, tạo ở pha sáng và chuyển sang stroma để vận hành chu trình Calvin."]};
const sc=new THREE.Scene();

const ct=new THREE.OrbitControls(cam,rd.domElement);ct.target.copy(HOME.t);ct.enableDamping=true;ct.autoRotate=true;ct.autoRotateSpeed=.7;ct.maxDistance=70;ct.minDistance=3;

const dl=new THREE.DirectionalLight(0xffffff,.55);dl.position.set(8,20,14);sc.add(dl);
const pick=[],labels=[];

const sun=at(new THREE.Mesh(new THREE.SphereGeometry(2.1,32,24),new THREE.MeshBasicMaterial({color:0xfff68a})),0,15,-4);sun.userData.k='sun';pick.push(sun);
at(new THREE.Mesh(new THREE.SphereGeometry(4.2,32,24),new THREE.MeshBasicMaterial({color:0xe9eadf,transparent:true,opacity:.7,depthWrite:false})),0,15,-4.6);
// Chậu, cỏ

at(M(new THREE.CylinderGeometry(3.2,3.2,.06,48),0x6b4423,null),0,-5,0);

// Lá cà phê: bóng, gân rõ, có khí khổng
function leafTex(a,b){const c=document.createElement('canvas');c.width=256;c.height=100;const g=c.getContext('2d');

g.fillStyle='rgba(255,255,255,.12)';g.beginPath();g.ellipse(120,34,80,9,-.06,0,7);g.fill();g.fillStyle='rgba(10,60,25,.5)';for(let i=0;i<90;i++){const x=rn(30,230),y=rn(22,78);g.beginPath();g.ellipse(x,y,2.4,1.3,rn(0,3),0,7);g.fill()}

const lm=[leafTex('#3fae48','#1f7a2c'),leafTex('#4cbb4c','#26883a'),leafTex('#2f9a40','#176a28')].map(t=>new THREE.MeshStandardMaterial({map:t,alphaTest:.5,side:THREE.DoubleSide,roughness:.35,metalness:.05}));
const leafPts=[];function leafGeo(L){const g=new THREE.PlaneGeometry(L,L*.46,14,4);g.translate(L/2,0,0);const p=g.attributes.position,h=L*.23,ph=rn(0,6);for(let i=0;i<p.count;i++){const u=p.getX(i)/L,v=p.getY(i)/h,a=Math.abs(v);p.setZ(i,L*(.2*u-.4*u*u)+L*.07*a*(1-u*.6)+L*.02*a*Math.sin(u*16+ph)+L*.025*v*u)}g.rotateX(-1.05);g.computeVertexNormals();return g}
for(let n=0;n<10;n++){const y=1.3+n*.85+rn(-.15,.15);for(let s=0;s<(n%3==2?1:2);s++){const L=(3.6-n*.14)*rn(.8,1.15);const g=leafGeo(L);
const l=new THREE.Mesh(g,lm[(n+s)%3]);l.position.set(0,y,0);l.rotation.y=n*2.4+s*(2.6+rn(-.5,.5))+rn(-.3,.3);l.rotation.x=rn(-.3,.3);l.rotation.z=rn(-.3,.3);l.userData.k='leaf';sc.add(l);pick.push(l);leafPts.push(V3(Math.cos(-l.rotation.y)*L*.6,y,Math.sin(-l.rotation.y)*L*.6))}}
for(let b=0;b<7;b++){const y0=2.2+b*1.05+rn(-.2,.2),az=b*2.4+rn(-.4,.4),len=rn(1.8,3),dx=Math.cos(az),dz=Math.sin(az);
const cv=new THREE.CatmullRomCurve3([V3(0,y0,0),V3(dx*len*.4,y0+.35,dz*len*.4),V3(dx*len*.8,y0+.55,dz*len*.8),V3(dx*len,y0+.45,dz*len)]);
at(M(new THREE.TubeGeometry(cv,10,.055,6),0x6a8f3c,'trunk'),0,0,0);

// Rễ: cọc + rễ bên + nhánh nhỏ, thu nhỏ dần, rất nhiều lông hút

function grow(st,dir,len,segs,dep,chain,own){const pts=[st.clone()],cur=st.clone(),d=dir.clone(),step=len/segs;
for(let i=0;i<segs;i++){d.x+=rn(-.2,.2);d.z+=rn(-.2,.2);d.y+=(dep?-.05:-.02)+rn(-.08,.08);if(dep){d.x+=cur.x*.035;d.z+=cur.z*.035}d.normalize();cur.addScaledVector(d,step);

const ch=chain.concat(pts.slice(1));const cv=new THREE.CatmullRomCurve3(pts);const rad=[.16,.11,.065,.04][dep],sg=segs*3;
const g=new THREE.TubeGeometry(cv,sg,rad,5);const pp=g.attributes.position;for(let i=0;i<=sg;i++){const c=cv.getPointAt(i/sg),f=1-.75*i/sg;for(let j=0;j<=5;j++){const k=i*6+j;pp.setXYZ(k,c.x+(pp.getX(k)-c.x)*f,c.y+(pp.getY(k)-c.y)*f,c.z+(pp.getZ(k)-c.z)*f)}}
